<script>
  (function() {
    const emailInput = document.getElementById('email');
    const clearEmailBtn = document.getElementById('clearEmail');
    const validNotice = document.getElementById('validNotice');
    const passwordInput = document.getElementById('password');
    const togglePasswordBtn = document.getElementById('togglePassword');
    const eyeIcon = document.getElementById('eyeIcon');
    const submitBtn = document.getElementById('submitBtn');

    if (emailInput && clearEmailBtn) {
      emailInput.addEventListener('input', function() {
        if (this.value.length > 0) {
          clearEmailBtn.classList.remove('hidden');
          clearEmailBtn.classList.add('flex');
        } else {
          clearEmailBtn.classList.add('hidden');
          clearEmailBtn.classList.remove('flex');
        }
        
        if (this.validity.valid && this.value.includes('@') && this.value.includes('.')) {
          validNotice?.classList.remove('hidden');
        } else {
          validNotice?.classList.add('hidden');
        }
      });

      clearEmailBtn.addEventListener('click', function() {
        emailInput.value = '';
        clearEmailBtn.classList.add('hidden');
        validNotice?.classList.add('hidden');
        emailInput.focus();
      });
    }

    if (togglePasswordBtn && passwordInput && eyeIcon) {
      togglePasswordBtn.addEventListener('click', function() {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }

    if (submitBtn) {
      submitBtn.addEventListener('click', function() {
        if (emailInput && emailInput.checkValidity() && passwordInput && passwordInput.value.length > 0) {
          const originalText = submitBtn.innerHTML;
          submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[18px]">progress_activity</span> Authenticating...';
          submitBtn.disabled = true;
          setTimeout(() => {
            submitBtn.innerHTML = originalText;
            submitBtn.disabled = false;
          }, 1500);
        }
      });
    }
  })();
